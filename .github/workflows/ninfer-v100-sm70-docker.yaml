# Reference: Multi-platform image with GitHub Actions
# https://docs.docker.com/build/ci/github-actions/multi-platform/
# https://docs.docker.com/build/ci/github-actions/push-multi-registries/

name: ninfer-v100-sm70-docker
concurrency: deploy-${{ github.workflow }}

on: 
  workflow_dispatch:

env:
  IMAGE_CONTEXT: ./ninfer-v100-sm70
  PROJECT_NAME: ninfer-v100-sm70
  REGISTRY_IMAGE: ${{ github.repository_owner }}/ninfer-v100-sm70
  TARGET_PLATFORMS: |
    linux/amd64

jobs:
  build-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read 
      packages: write
    steps:
      - name: Prepare
        run: |
          echo "TODAY=$(date +'%Y%m%d')" >> $GITHUB_ENV
          echo "TODAY: $TODAY"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: clone project
        run: |
          chmod +x ${{ env.PROJECT_NAME }}/build.sh
          ./${{ env.PROJECT_NAME }}/build.sh

      - name: Build images
        id: build
        uses: docker/build-push-action@v6
        with:
          platforms: ${{ env.TARGET_PLATFORMS }}
          context: ${{ env.IMAGE_CONTEXT }}
          file: ${{ env.IMAGE_CONTEXT }}/Dockerfile
          labels: ${{ steps.meta.outputs.labels }}
          tags: |
            ${{ env.REGISTRY_IMAGE }}:latest
            ${{ env.REGISTRY_IMAGE }}:${{ env.TODAY }}
            ghcr.io/${{ env.REGISTRY_IMAGE }}:latest
            ghcr.io/${{ env.REGISTRY_IMAGE }}:${{ env.TODAY }}
          push: true
          build-args: |
            GITHUB_ACTIONS=true
